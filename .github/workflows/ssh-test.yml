name: SSH Connection Test

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "SSH Request ID"
        required: true
        type: string

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Show request
        run: |
          echo "SSH request received:"
          echo "${{ inputs.request_id }}"