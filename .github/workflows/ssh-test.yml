name: SSH Connection Test

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "SSH Request ID"
        required: true
        type: string

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: Validate request ID
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [[ ! "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{20,100}$ ]]; then
            echo "Invalid request_id"
            exit 1
          fi

      - name: Read SSH request from D1
        id: request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          python3 <<'PY'
          import os
          import subprocess
          import json

          request_id = os.environ["REQUEST_ID"]

          def sql_escape(value):
              return value.replace("'", "''")

          sql = f"""
          SELECT
            r.id,
            r.status,
            r.site_id,
            r.user_id,
            r.expires_at,
            s.hostname,
            s.port,
            s.username,
            s.ssh_password_ciphertext,
            s.ssh_password_iv
          FROM ssh_requests r
          JOIN sites s ON s.id = r.site_id
          WHERE r.id = '{sql_escape(request_id)}'
          LIMIT 1
          """

          result = subprocess.run(
              [
                  "npx",
                  "wrangler@latest",
                  "d1",
                  "execute",
                  "DB",
                  "--remote",
                  "--json",
                  "--command",
                  sql
              ],
              capture_output=True,
              text=True,
              check=False
          )

          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit(result.returncode)

          data = json.loads(result.stdout)

          rows = []

          for item in data:
              if isinstance(item, dict) and "results" in item:
                  rows.extend(item["results"])

          if not rows:
              raise SystemExit("SSH request not found")

          row = rows[0]

          required = [
              "hostname",
              "port",
              "username",
              "ssh_password_ciphertext",
              "ssh_password_iv"
          ]

          for field in required:
              if not row.get(field):
                  raise SystemExit(
                      f"Missing SSH field: {field}"
                  )

          if row.get("status") not in ["pending", "running"]:
              raise SystemExit(
                  f"Invalid request status: {row.get('status')}"
              )

          if row.get("expires_at"):
              from datetime import datetime, timezone

              expires = datetime.fromisoformat(
                  row["expires_at"].replace("Z", "+00:00")
              )

              if expires < datetime.now(timezone.utc):
                  raise SystemExit("SSH request expired")

          output = {
              "hostname": str(row["hostname"]),
              "port": int(row["port"]),
              "username": str(row["username"]),
              "ciphertext": str(row["ssh_password_ciphertext"]),
              "iv": str(row["ssh_password_iv"])
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              for key, value in output.items():
                  f.write(
                      f"{key}<<EOF\n{value}\nEOF\n"
                  )
          PY

      - name: Decrypt SSH password
        id: decrypt
        env:
          SSH_ENCRYPTION_KEY: ${{ secrets.SSH_ENCRYPTION_KEY }}
          SSH_CIPHERTEXT: ${{ steps.request.outputs.ciphertext }}
          SSH_IV: ${{ steps.request.outputs.iv }}
        run: |
          set -e

          node <<'NODE'
          const crypto = require("crypto");

          const secret =
            process.env.SSH_ENCRYPTION_KEY;

          const ciphertext =
            Buffer.from(
              process.env.SSH_CIPHERTEXT,
              "base64"
            );

          const iv =
            Buffer.from(
              process.env.SSH_IV,
              "base64"
            );

          const key =
            Buffer.from(secret, "utf8");

          if (key.length !== 16 &&
              key.length !== 24 &&
              key.length !== 32) {
            throw new Error(
              "SSH_ENCRYPTION_KEY must be 16, 24, or 32 bytes"
            );
          }

          /*
           * WebCrypto AES-GCM stores the authentication
           * tag at the end of the encrypted data.
           */
          const tagLength = 16;

          if (ciphertext.length <= tagLength) {
            throw new Error(
              "Invalid encrypted SSH password"
            );
          }

          const encrypted =
            ciphertext.subarray(
              0,
              ciphertext.length - tagLength
            );

          const authTag =
            ciphertext.subarray(
              ciphertext.length - tagLength
            );

          const decipher =
            crypto.createDecipheriv(
              `aes-${key.length * 8}-gcm`,
              key,
              iv
            );

          decipher.setAuthTag(authTag);

          const password =
            Buffer.concat([
              decipher.update(encrypted),
              decipher.final()
            ]).toString("utf8");

          if (!password) {
            throw new Error(
              "SSH password is empty"
            );
          }

          console.log(
            "::add-mask::" + password
          );

          const fs = require("fs");

          fs.writeFileSync(
            process.env.GITHUB_ENV,
            `SSHPASS=${password}\n`,
            {
              encoding: "utf8",
              flag: "a"
            }
          );
          NODE

      - name: Test SSH connection
        id: ssh
        env:
          SSHPASS: ${{ env.SSHPASS }}
          SSH_HOST: ${{ steps.request.outputs.hostname }}
          SSH_PORT: ${{ steps.request.outputs.port }}
          SSH_USER: ${{ steps.request.outputs.username }}
        run: |
          set +e

          echo "Testing SSH connection..."
          echo "Host: $SSH_HOST"
          echo "Port: $SSH_PORT"
          echo "User: $SSH_USER"

          OUTPUT=$(
            sshpass -e ssh \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "printf 'SSH_CONNECTION_OK'"
            2>&1
          )

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ] &&
             [ "$OUTPUT" = "SSH_CONNECTION_OK" ]; then

            echo "SSH connection successful."
            echo "result=success" >> "$GITHUB_OUTPUT"

          else

            echo "SSH connection failed."
            echo "result=failure" >> "$GITHUB_OUTPUT"

            echo "$OUTPUT" | \
              sed \
                -e "s/${SSHPASS}/[REDACTED]/g"

            exit 1
          fi

      - name: Update successful result in D1
        if: success()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import os
          import subprocess

          request_id = os.environ["REQUEST_ID"]

          def sql_escape(value):
              return value.replace("'", "''")

          sql = f"""
          UPDATE ssh_requests
          SET
            status = 'completed',
            result = 'SSH connection successful',
            error = NULL,
            completed_at = CURRENT_TIMESTAMP
          WHERE id = '{sql_escape(request_id)}'
          """

          subprocess.run(
              [
                  "npx",
                  "wrangler@latest",
                  "d1",
                  "execute",
                  "DB",
                  "--remote",
                  "--command",
                  sql
              ],
              check=True
          )

          sql2 = f"""
          UPDATE sites
          SET
            ssh_test_status = 'success',
            ssh_test_message = 'تم الاتصال بالسيرفر عبر SSH بنجاح',
            ssh_tested_at = CURRENT_TIMESTAMP
          WHERE id = (
            SELECT site_id
            FROM ssh_requests
            WHERE id = '{sql_escape(request_id)}'
            LIMIT 1
          )
          """

          subprocess.run(
              [
                  "npx",
                  "wrangler@latest",
                  "d1",
                  "execute",
                  "DB",
                  "--remote",
                  "--command",
                  sql2
              ],
              check=True
          )
          PY

      - name: Update failed result in D1
        if: failure()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import os
          import subprocess

          request_id = os.environ["REQUEST_ID"]

          def sql_escape(value):
              return value.replace("'", "''")

          sql = f"""
          UPDATE ssh_requests
          SET
            status = 'failed',
            result = NULL,
            error = 'SSH connection failed',
            completed_at = CURRENT_TIMESTAMP
          WHERE id = '{sql_escape(request_id)}'
          """

          subprocess.run(
              [
                  "npx",
                  "wrangler@latest",
                  "d1",
                  "execute",
                  "DB",
                  "--remote",
                  "--command",
                  sql
              ],
              check=True
          )

          sql2 = f"""
          UPDATE sites
          SET
            ssh_test_status = 'failed',
            ssh_test_message = 'فشل الاتصال بالسيرفر عبر SSH',
            ssh_tested_at = CURRENT_TIMESTAMP
          WHERE id = (
            SELECT site_id
            FROM ssh_requests
            WHERE id = '{sql_escape(request_id)}'
            LIMIT 1
          )
          """

          subprocess.run(
              [
                  "npx",
                  "wrangler@latest",
                  "d1",
                  "execute",
                  "DB",
                  "--remote",
                  "--command",
                  sql2
              ],
              check=True
          )
          PY